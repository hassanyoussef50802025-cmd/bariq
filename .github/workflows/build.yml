name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create React Native project
        run: |
          npx @react-native-community/cli@12 init BariqApp --version 0.73.0 --skip-install --npm
          cp App.js BariqApp/App.js
          cp BackgroundService.js BariqApp/BackgroundService.js
          cp index.js BariqApp/index.js
          cp logo.png BariqApp/logo.png 2>/dev/null || true
          convert logo.png -resize 72x72 BariqApp/android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
          convert logo.png -resize 48x48 BariqApp/android/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
          convert logo.png -resize 96x96 BariqApp/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
          convert logo.png -resize 144x144 BariqApp/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
          convert logo.png -resize 192x192 BariqApp/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
          mkdir -p BariqApp/android/app/src/main/java/com/bariqapp
          cat > BariqApp/android/app/src/main/java/com/bariqapp/BariqBackgroundService.java << 'JAVA'
          package com.bariqapp;
          import android.content.Intent;
          import android.os.Bundle;
          import com.facebook.react.HeadlessJsTaskService;
          import com.facebook.react.bridge.Arguments;
          import com.facebook.react.jstasks.HeadlessJsTaskConfig;
          import javax.annotation.Nullable;
          public class BariqBackgroundService extends HeadlessJsTaskService {
            @Override
            protected @Nullable HeadlessJsTaskConfig getTaskConfig(Intent intent) {
              Bundle extras = intent.getExtras();
              return new HeadlessJsTaskConfig(
                "BariqBackgroundTask",
                extras != null ? Arguments.fromBundle(extras) : Arguments.createMap(),
                5000,
                true
              );
            }
          }
          JAVA
          sed -i 's|</application>|<service android:name=".BariqBackgroundService" android:exported="false" />\n    </application>|' BariqApp/android/app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />|' BariqApp/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: |
          cd BariqApp
          npm install
          npm install @react-native-async-storage/async-storage@1.21.0
          npm install react-native-image-picker@7.1.0
          npm install @notifee/react-native@7.8.2

      - name: Build APK
        run: |
          cd BariqApp/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bariq-apk
          path: BariqApp/android/app/build/outputs/apk/release/*.apk
