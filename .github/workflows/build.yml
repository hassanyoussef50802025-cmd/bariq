name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create React Native project
        run: |
          npx @react-native-community/cli@12 init BariqApp --version 0.73.0 --skip-install --npm
          cp App.js BariqApp/App.js

      - name: Install dependencies
        run: |
          cd BariqApp
          npm install
          npm install @react-native-async-storage/async-storage

      - name: Build APK
        run: |
          cd BariqApp/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bariq-apk
          path: BariqApp/android/app/build/outputs/apk/release/*.apk
