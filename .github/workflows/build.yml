name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create React Native project
        run: |
          npx @react-native-community/cli@12 init BariqApp --version 0.73.0 --skip-install --npm
          cp App.js BariqApp/App.js
          cp index.js BariqApp/index.js
          cp logo.png BariqApp/logo.png 2>/dev/null || true
          cp Amiri-Regular.ttf BariqApp/Amiri-Regular.ttf 2>/dev/null || true
          mkdir -p BariqApp/android/app/src/main/assets
          cp Amiri-Regular.ttf BariqApp/android/app/src/main/assets/Amiri-Regular.ttf 2>/dev/null || true
          convert logo.png -resize 72x72 BariqApp/android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
          convert logo.png -resize 48x48 BariqApp/android/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
          convert logo.png -resize 96x96 BariqApp/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
          convert logo.png -resize 144x144 BariqApp/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
          convert logo.png -resize 192x192 BariqApp/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />|' BariqApp/android/app/src/main/AndroidManifest.xml

      - name: Create google-services.json
        run: |
          cat > BariqApp/android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_id": "bariq-ce6b4",
              "project_number": "000000000000",
              "firebase_url": "https://bariq-ce6b4-default-rtdb.firebaseio.com",
              "storage_bucket": "bariq-ce6b4.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "org.bariq"
                  }
                },
                "api_key": [{"current_key": "AIzaSyDhEo61jzd-npwhhw-Vf1R8fLWttJbJib8"}],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Install dependencies
        run: |
          cd BariqApp
          npm install
          npm install @react-native-async-storage/async-storage@1.21.0
          npm install react-native-image-picker@7.1.0
          npm install @notifee/react-native@7.8.2
          npm install @react-native-firebase/app@18.7.3
          npm install @react-native-firebase/messaging@18.7.3

      - name: Configure Firebase gradle
        run: |
          cd BariqApp/android
          sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'|" build.gradle
          echo "" >> app/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> app/build.gradle

      - name: Build APK
        run: |
          cd BariqApp/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bariq-apk
          path: BariqApp/android/app/build/outputs/apk/release/*.apk
